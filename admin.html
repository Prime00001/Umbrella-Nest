<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Umbrella Nest | অ্যাডমিন প্যানেল</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #07131e;
      --bg-surface: #0d2133;
      --bg-card: rgba(14, 34, 52, 0.88);
      --bg-elevated: rgba(20, 48, 72, 0.95);
      --text-main: #f1f7fc;
      --text-muted: #9eb7cc;
      --accent: #0ea5e9;
      --accent-dark: #0284c7;
      --accent-warm: #f97316;
      --accent-warm-dark: #ea580c;
      --success: #10b981;
      --danger: #ef4444;
      --border: rgba(148, 197, 233, 0.2);
      --shadow-3d: 0 18px 38px rgba(2, 10, 18, 0.55);
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top right, #102a43 0%, var(--bg-deep) 65%);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.55;
      padding-bottom: 48px;
    }

    .container { width: min(1240px, 92vw); margin: 0 auto; }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(14px);
      background: rgba(7, 19, 30, 0.88);
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
      margin-bottom: 24px;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .title-wrap h1 { font-size: 1.35rem; font-weight: 800; }
    .title-wrap p { font-size: 0.85rem; color: var(--text-muted); }

    .btn {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 16px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-main);
      background: var(--bg-elevated);
      transition: transform 0.2s ease;
    }

    .btn:hover { transform: translateY(-2px); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-warm), var(--accent-warm-dark));
      border: none;
      color: #fff;
    }

    .btn-sky {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      border: none;
      color: #fff;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow-3d);
      margin-bottom: 22px;
    }

    .panel h2 { font-size: 1.2rem; font-weight: 800; margin-bottom: 14px; color: #bae6fd; }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }

    label { font-size: 0.86rem; color: var(--text-muted); font-weight: 600; }

    input, select, textarea {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 12px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
    }

    input[type="file"] { padding: 8px; }

    .preview-thumb {
      width: 100%;
      max-height: 170px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-top: 8px;
      display: none;
    }

    .items-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .item-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 10px;
    }

    .order-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: rgba(14, 165, 233, 0.2);
      color: #7dd3fc;
    }

    .notice {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 11px;
      font-size: 0.88rem;
      font-weight: 600;
      display: none;
    }

    .notice.ok { display: block; background: rgba(16, 185, 129, 0.16); border: 1px solid rgba(16, 185, 129, 0.45); color: #6ee7b7; }
    .notice.err { display: block; background: rgba(239, 68, 68, 0.16); border: 1px solid rgba(239, 68, 68, 0.45); color: #fca5a5; }

    .hidden { display: none !important; }

    @media (max-width: 900px) {
      .items-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .grid-2, .items-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <div class="title-wrap">
        <h1>Umbrella Nest • অ্যাডমিন প্যানেল</h1>
        <p>হিরো ব্যানার (সর্বোচ্চ ১০০টি), পণ্য এবং অর্ডার ম্যানেজ করুন • লোকাল ডিভাইস থেকে ছবি আপলোড সমর্থিত</p>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <a href="index.html" class="btn btn-sky">← স্টোরফ্রন্ট দেখুন</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="tabs">
      <button type="button" class="tab-btn active" data-tab="bannersTab">হিরো ব্যানার (সর্বোচ্চ ১০০)</button>
      <button type="button" class="tab-btn" data-tab="productsTab">পণ্য যোগ ও তালিকা</button>
      <button type="button" class="tab-btn" data-tab="ordersTab">কাস্টমার অর্ডারসমূহ</button>
    </div>

    <section id="bannersTab" class="panel">
      <h2>হিরো ব্যানার ম্যানেজার (<span id="bannerCountLabel">0</span> / ১০০)</h2>
      <form id="bannerForm" class="grid-2">
        <div class="form-group">
          <label for="bannerTitleBn">ব্যানার শিরোনাম (বাংলা) *</label>
          <input type="text" id="bannerTitleBn" required placeholder="যেমন: মনসুন স্পেশাল অফার" />
        </div>
        <div class="form-group">
          <label for="bannerTitleEn">ব্যানার শিরোনাম (English)</label>
          <input type="text" id="bannerTitleEn" placeholder="e.g. Monsoon Special Offer" />
        </div>
        <div class="form-group">
          <label for="bannerSubBn">সাবটাইটেল (বাংলা)</label>
          <input type="text" id="bannerSubBn" placeholder="যেমন: ঝড়-বৃষ্টিতে ওয়াটারপ্রুফ সুরক্ষা" />
        </div>
        <div class="form-group">
          <label for="bannerSubEn">সাবটাইটেল (English)</label>
          <input type="text" id="bannerSubEn" placeholder="e.g. Waterproof protection for heavy rain" />
        </div>
        <div class="form-group">
          <label for="bannerFileInput">ডিভাইস / লোকাল স্টোরেজ থেকে ব্যানার ছবি আপলোড করুন</label>
          <input type="file" id="bannerFileInput" accept="image/*" />
        </div>
        <div class="form-group">
          <label for="bannerUrlInput">অথবা ছবির লিংক দিন (ঐচ্ছিক)</label>
          <input type="url" id="bannerUrlInput" placeholder="https://..." />
        </div>
        <div class="form-group full">
          <img id="bannerPreview" class="preview-thumb" alt="Banner Preview" />
          <div id="bannerNotice" class="notice"></div>
          <button type="submit" class="btn btn-primary" style="margin-top:10px; justify-content:center;">+ হিরো ব্যানার যোগ করুন</button>
        </div>
      </form>

      <div class="items-list" id="bannerListGrid"></div>
    </section>

    <section id="productsTab" class="panel hidden">
      <h2>নতুন ছাতা / পণ্য যোগ করুন</h2>
      <form id="productForm" class="grid-2">
        <div class="form-group">
          <label for="prodTitleBn">পণ্যের নাম (বাংলা) *</label>
          <input type="text" id="prodTitleBn" required placeholder="যেমন: আল্ট্রা স্টর্ম ফোল্ডিং ছাতা" />
        </div>
        <div class="form-group">
          <label for="prodTitleEn">পণ্যের নাম (English) *</label>
          <input type="text" id="prodTitleEn" required placeholder="e.g. Ultra Storm Folding Umbrella" />
        </div>
        <div class="form-group">
          <label for="prodCategory">ক্যাটাগরি *</label>
          <select id="prodCategory">
            <option value="folding">ফোল্ডিং ছাতা (Folding)</option>
            <option value="golf">বড় গল্ফ ছাতা (Golf)</option>
            <option value="kids">কিডস ছাতা (Kids)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="prodPrice">বর্তমান মূল্য (৳) *</label>
          <input type="number" id="prodPrice" required min="1" placeholder="750" />
        </div>
        <div class="form-group">
          <label for="prodOldPrice">পূর্বের মূল্য (৳) *</label>
          <input type="number" id="prodOldPrice" required min="1" placeholder="950" />
        </div>
        <div class="form-group">
          <label for="prodSize">সাইজ *</label>
          <input type="text" id="prodSize" required value="21 Inch (Compact)" />
        </div>
        <div class="form-group">
          <label for="prodFileInput">ডিভাইস / লোকাল স্টোরেজ থেকে পণ্যের ছবি আপলোড করুন</label>
          <input type="file" id="prodFileInput" accept="image/*" />
        </div>
        <div class="form-group">
          <label for="prodUrlInput">অথবা ছবির লিংক দিন (ঐচ্ছিক)</label>
          <input type="url" id="prodUrlInput" placeholder="https://..." />
        </div>
        <div class="form-group full">
          <label for="prodDescBn">বিবরণ (বাংলা)</label>
          <textarea id="prodDescBn" rows="2" placeholder="পণ্যের সংক্ষিপ্ত বিবরণ লিখুন"></textarea>
        </div>
        <div class="form-group full">
          <img id="prodPreview" class="preview-thumb" alt="Product Preview" />
          <div id="prodNotice" class="notice"></div>
          <button type="submit" class="btn btn-primary" style="margin-top:10px; justify-content:center;">+ পণ্য সেভ করুন</button>
        </div>
      </form>

      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:26px;">
        <h2 style="margin:0;">সংরক্ষিত পণ্যসমূহ (<span id="prodCountLabel">0</span>)</h2>
        <input type="search" id="adminProductSearchInput" placeholder="পণ্য খুঁজুন..." style="max-width:300px;" />
      </div>
      <div class="items-list" id="productListGrid"></div>
    </section>

    <section id="ordersTab" class="panel hidden">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px;">
        <h2 style="margin:0;">কাস্টমার অর্ডারসমূহ (<span id="orderCountLabel">0</span>)</h2>
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <input type="search" id="adminOrderSearchInput" placeholder="নাম বা ফোন নম্বর দিয়ে অর্ডার খুঁজুন..." style="max-width:300px;" />
          <button type="button" class="btn btn-danger" id="clearAllOrdersBtn" onclick="deleteAllOrders()">সব অর্ডার ডিলিট করুন</button>
        </div>
      </div>
      <div id="ordersListContainer"></div>
    </section>
  </main>

  <script>
    const STORAGE_KEYS = {
      PRODUCTS: "umbrellanest_products_v1",
      ORDERS: "umbrellanest_orders_v1",
      BANNERS: "umbrellanest_banners_v1"
    };

    const MAX_BANNERS = 100;

    let uploadedBannerDataUrl = "";
    let uploadedProductDataUrl = "";

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(new Error("File read failed"));
        reader.readAsDataURL(file);
      });
    }

    function getBanners() {
      try {
        const arr = JSON.parse(localStorage.getItem(STORAGE_KEYS.BANNERS) || "[]");
        return Array.isArray(arr) ? arr.slice(0, MAX_BANNERS) : [];
      } catch (_) {
        return [];
      }
    }

    function saveBanners(list) {
      localStorage.setItem(STORAGE_KEYS.BANNERS, JSON.stringify(list.slice(0, MAX_BANNERS)));
    }

    function getProducts() {
      try {
        const arr = JSON.parse(localStorage.getItem(STORAGE_KEYS.PRODUCTS) || "[]");
        return Array.isArray(arr) ? arr : [];
      } catch (_) {
        return [];
      }
    }

    function saveProducts(list) {
      localStorage.setItem(STORAGE_KEYS.PRODUCTS, JSON.stringify(list));
    }

    function getOrders() {
      try {
        const arr = JSON.parse(localStorage.getItem(STORAGE_KEYS.ORDERS) || "[]");
        return Array.isArray(arr) ? arr : [];
      } catch (_) {
        return [];
      }
    }

    function saveOrders(list) {
      localStorage.setItem(STORAGE_KEYS.ORDERS, JSON.stringify(list));
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const target = btn.getAttribute("data-tab");
        ["bannersTab", "productsTab", "ordersTab"].forEach(id => {
          document.getElementById(id).classList.toggle("hidden", id !== target);
        });
        if (target === "ordersTab") renderOrders();
      });
    });

    document.getElementById("bannerFileInput").addEventListener("change", async function (e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      uploadedBannerDataUrl = await readFileAsDataUrl(file);
      const prev = document.getElementById("bannerPreview");
      prev.src = uploadedBannerDataUrl;
      prev.style.display = "block";
    });

    document.getElementById("bannerUrlInput").addEventListener("input", function (e) {
      const url = e.target.value.trim();
      const prev = document.getElementById("bannerPreview");
      if (url) {
        prev.src = url;
        prev.style.display = "block";
      } else if (!uploadedBannerDataUrl) {
        prev.style.display = "none";
      }
    });

    function renderBanners() {
      const banners = getBanners();
      document.getElementById("bannerCountLabel").textContent = banners.length;
      const grid = document.getElementById("bannerListGrid");
      if (!banners.length) {
        grid.innerHTML = `<p style="color:var(--text-muted);">এখনো কোনো হিরো ব্যানার যুক্ত করা হয়নি।</p>`;
        return;
      }
      grid.innerHTML = banners.map((b, idx) => `
        <div class="item-card">
          <img src="${b.image}" alt="${b.titleBn || b.titleEn || 'Banner'}" />
          <div style="font-weight:700;">#${idx + 1} • ${b.titleBn || b.titleEn || "Banner"}</div>
          <div style="font-size:0.84rem; color:var(--text-muted);">${b.subBn || b.subEn || ""}</div>
          <button type="button" class="btn btn-danger" onclick="deleteBanner('${b.id}')">মুছে ফেলুন</button>
        </div>
      `).join("");
    }

    function deleteBanner(id) {
      const next = getBanners().filter(b => b.id !== id);
      saveBanners(next);
      renderBanners();
    }

    document.getElementById("bannerForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const notice = document.getElementById("bannerNotice");
      notice.className = "notice";

      const current = getBanners();
      if (current.length >= MAX_BANNERS) {
        notice.className = "notice err";
        notice.textContent = "সর্বোচ্চ ১০০টি হিরো ব্যানার যুক্ত করা যাবে। নতুন ব্যানার যোগ করতে পুরোনো ব্যানার মুছুন।";
        return;
      }

      const titleBn = document.getElementById("bannerTitleBn").value.trim();
      const titleEn = document.getElementById("bannerTitleEn").value.trim() || titleBn;
      const subBn = document.getElementById("bannerSubBn").value.trim();
      const subEn = document.getElementById("bannerSubEn").value.trim() || subBn;
      const urlVal = document.getElementById("bannerUrlInput").value.trim();
      const finalImage = uploadedBannerDataUrl || urlVal;

      if (!finalImage) {
        notice.className = "notice err";
        notice.textContent = "দয়া করে ডিভাইস থেকে একটি ছবি আপলোড করুন অথবা ছবির লিংক দিন।";
        return;
      }

      current.push({
        id: "bnr-" + Date.now(),
        titleBn,
        titleEn,
        subBn,
        subEn,
        image: finalImage
      });

      saveBanners(current);
      uploadedBannerDataUrl = "";
      document.getElementById("bannerForm").reset();
      document.getElementById("bannerPreview").style.display = "none";
      renderBanners();

      notice.className = "notice ok";
      notice.textContent = "নতুন হিরো ব্যানার যুক্ত হয়েছে! স্টোরফ্রন্টে স্বয়ংক্রিয়ভাবে স্লাইড হবে।";
    });

    document.getElementById("prodFileInput").addEventListener("change", async function (e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      uploadedProductDataUrl = await readFileAsDataUrl(file);
      const prev = document.getElementById("prodPreview");
      prev.src = uploadedProductDataUrl;
      prev.style.display = "block";
    });

    document.getElementById("prodUrlInput").addEventListener("input", function (e) {
      const url = e.target.value.trim();
      const prev = document.getElementById("prodPreview");
      if (url) {
        prev.src = url;
        prev.style.display = "block";
      } else if (!uploadedProductDataUrl) {
        prev.style.display = "none";
      }
    });

    function renderProductsAdmin() {
      const products = getProducts();
      const q = (document.getElementById("adminProductSearchInput")?.value || "").trim().toLowerCase();
      const filtered = !q ? products : products.filter(p => {
        const hay = `${p.titleBn || ""} ${p.titleEn || ""} ${p.catBn || ""} ${p.catEn || ""} ${p.price || ""}`.toLowerCase();
        return hay.includes(q);
      });
      document.getElementById("prodCountLabel").textContent = filtered.length;
      const grid = document.getElementById("productListGrid");
      if (!filtered.length) {
        grid.innerHTML = `<p style="color:var(--text-muted);">কোনো পণ্য পাওয়া যায়নি।</p>`;
        return;
      }
      grid.innerHTML = filtered.map(p => `
        <div class="item-card">
          <img src="${(p.images && p.images[0]) || ''}" alt="${p.titleBn || p.titleEn}" />
          <div style="font-weight:700;">${p.titleBn || p.titleEn}</div>
          <div style="font-size:0.84rem; color:#38bdf8; font-weight:700;">৳${p.price}</div>
          <button type="button" class="btn btn-danger" onclick="deleteProductAdmin('${p.id}')">মুছে ফেলুন</button>
        </div>
      `).join("");
    }

    function deleteProductAdmin(id) {
      const next = getProducts().filter(p => p.id !== id);
      saveProducts(next);
      renderProductsAdmin();
    }

    document.getElementById("productForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const notice = document.getElementById("prodNotice");
      notice.className = "notice";

      const titleBn = document.getElementById("prodTitleBn").value.trim();
      const titleEn = document.getElementById("prodTitleEn").value.trim();
      const category = document.getElementById("prodCategory").value;
      const price = Number(document.getElementById("prodPrice").value || 0);
      const oldPrice = Number(document.getElementById("prodOldPrice").value || price);
      const size = document.getElementById("prodSize").value.trim() || "Standard";
      const descBn = document.getElementById("prodDescBn").value.trim();
      const urlVal = document.getElementById("prodUrlInput").value.trim();
      const finalImg = uploadedProductDataUrl || urlVal || "https://images.unsplash.com/photo-1519692933481-e162a57d6721?auto=format&fit=crop&w=900&q=80";

      const catMap = {
        folding: { bn: "ফোল্ডিং ছাতা", en: "Folding Umbrella" },
        golf: { bn: "বড় গল্ফ ছাতা", en: "Large Golf Umbrella" },
        kids: { bn: "কিডস ছাতা", en: "Kids Umbrella" }
      };

      const newProd = {
        id: "un-" + Date.now(),
        category,
        catBn: catMap[category].bn,
        catEn: catMap[category].en,
        titleBn,
        titleEn,
        price,
        oldPrice: oldPrice >= price ? oldPrice : price + 150,
        colors: [{ nameBn: "নেভি ব্লু", nameEn: "Navy Blue", hex: "#0f3d5e" }],
        sizes: [size],
        materialBn: "ওয়াটার-রিপেলেন্ট পঞ্জি ফ্যাব্রিক",
        materialEn: "Water-Repellent Pongee Fabric",
        descBn: descBn || "অল-ওয়েদার ছাতা।",
        descEn: descBn || "All-weather umbrella.",
        images: [finalImg]
      };

      const products = getProducts();
      products.unshift(newProd);
      saveProducts(products);

      uploadedProductDataUrl = "";
      document.getElementById("productForm").reset();
      document.getElementById("prodPreview").style.display = "none";
      renderProductsAdmin();

      notice.className = "notice ok";
      notice.textContent = "নতুন পণ্য সংরক্ষণ করা হয়েছে!";
    });

    function updateOrderStatus(orderId, newStatus) {
      const orders = getOrders().map(o => {
        if (String(o.orderId) === String(orderId)) {
          return { ...o, status: newStatus };
        }
        return o;
      });
      saveOrders(orders);
      renderOrders();
    }

    function deleteOrder(orderId) {
      const orders = getOrders().filter(o => String(o.orderId) !== String(orderId));
      saveOrders(orders);
      renderOrders();
    }

    function deleteAllOrders() {
      saveOrders([]);
      renderOrders();
    }

    function renderOrders() {
      const orders = getOrders();
      const q = (document.getElementById("adminOrderSearchInput")?.value || "").trim().toLowerCase();
      const qDigits = q.replace(/\D/g, "");
      const filtered = !q ? orders : orders.filter(o => {
        const nameMatch = String(o.name || "").toLowerCase().includes(q);
        const p1Digits = String(o.phone1 || "").replace(/\D/g, "");
        const p2Digits = String(o.phone2 || "").replace(/\D/g, "");
        const phoneMatch = (qDigits && (p1Digits.includes(qDigits) || p2Digits.includes(qDigits))) ||
          String(o.phone1 || "").toLowerCase().includes(q) ||
          String(o.phone2 || "").toLowerCase().includes(q);
        return nameMatch || phoneMatch;
      });
      document.getElementById("orderCountLabel").textContent = filtered.length;
      const wrap = document.getElementById("ordersListContainer");
      if (!filtered.length) {
        wrap.innerHTML = `<p style="color:var(--text-muted);">কোনো অর্ডার পাওয়া যায়নি।</p>`;
        return;
      }
      wrap.innerHTML = filtered.map(o => {
        const currentStatus = o.status || "Pending";
        return `
        <div class="order-card">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
            <strong>#${o.orderId} • ${o.name}</strong>
            <span class="badge">${currentStatus}</span>
          </div>
          <div style="font-size:0.88rem; color:var(--text-muted); margin-top:6px;">
            ফোন: ${o.phone1} / ${o.phone2} • ঠিকানা: ${o.address}
          </div>
          <div style="font-size:0.9rem; color:#38bdf8; font-weight:700; margin-top:6px;">
            মোট: ৳${o.totalPrice} (${o.payment})
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center;">
            <select aria-label="Order Status" style="width:auto; padding:6px 10px; font-size:0.84rem;" onchange="updateOrderStatus('${o.orderId}', this.value)">
              <option value="Pending" ${currentStatus === "Pending" ? "selected" : ""}>Pending</option>
              <option value="Confirmed" ${currentStatus === "Confirmed" ? "selected" : ""}>Confirmed</option>
              <option value="Delivered / Completed" ${currentStatus === "Delivered / Completed" ? "selected" : ""}>Delivered / Completed</option>
            </select>
            <button type="button" class="btn btn-danger" style="padding:6px 12px; font-size:0.82rem;" onclick="deleteOrder('${o.orderId}')">ডিলিট করুন</button>
          </div>
        </div>
      `;
      }).join("");
    }

    document.getElementById("adminOrderSearchInput")?.addEventListener("input", renderOrders);
    document.getElementById("adminProductSearchInput")?.addEventListener("input", renderProductsAdmin);

    renderBanners();
    renderProductsAdmin();
    renderOrders();
  </script>
</body>
</html>
