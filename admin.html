<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Umbrella Nest | অ্যাডমিন প্যানেল</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #07131e;
      --bg-surface: #0d2133;
      --bg-card: rgba(14, 34, 52, 0.9);
      --text-main: #f1f7fc;
      --text-muted: #9eb7cc;
      --accent: #0ea5e9;
      --accent-warm: #f97316;
      --success: #10b981;
      --danger: #ef4444;
      --border: rgba(148, 197, 233, 0.18);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top right, #102a43 0%, var(--bg-deep) 65%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 0 44px;
    }

    .container { width: min(1240px, 92vw); margin: 0 auto; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 22px;
      padding: 14px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .btn {
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 9px 14px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      color: var(--text-main);
      background: var(--bg-surface);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-sky { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-warm { background: var(--accent-warm); border-color: var(--accent-warm); color: #fff; }
    .btn-danger { background: rgba(239, 68, 68, 0.18); border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .full { grid-column: 1 / -1; }

    label { display: block; font-size: 0.84rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
    input, select, textarea {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.9rem;
    }

    .list-item {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .meta { font-size: 0.84rem; color: var(--text-muted); }

    @media (max-width: 820px) {
      .grid-2, .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <h1 style="font-size: 1.3rem; font-weight: 800;">Umbrella Nest — আলাদা অ্যাডমিন প্যানেল</h1>
        <div class="meta">কাস্টমার ওয়েবসাইটের প্রোডাক্ট ও অর্ডার পরিচালনা (admin.html)</div>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <a href="./index.html" class="btn">← কাস্টমার স্টোরে ফিরুন</a>
        <button type="button" class="btn btn-danger" id="lockBtn">লক করুন</button>
      </div>
    </div>

    <div class="card" id="pinGateCard" style="max-width: 440px; margin: 40px auto;">
      <h2 style="font-size: 1.15rem; margin-bottom: 8px;">অ্যাডমিন পিন দিন</h2>
      <p class="meta" style="margin-bottom: 14px;">ডিফল্ট পিন: 1234</p>
      <form id="pinForm" style="display:flex; flex-direction:column; gap:12px;">
        <input type="password" id="pinInput" placeholder="পিন লিখুন" required />
        <button type="submit" class="btn btn-sky" style="justify-content:center;">প্রবেশ করুন</button>
      </form>
      <div id="pinErr" style="color:#fca5a5; font-size:0.86rem; margin-top:8px;"></div>
    </div>

    <div id="adminWorkspace" style="display:none;">
      <div class="grid-2">
        <div class="card">
          <h2 style="font-size: 1.12rem; margin-bottom: 14px;">নতুন ছাতা যোগ করুন</h2>
          <form id="addProductForm" class="form-grid">
            <div>
              <label>নাম (বাংলা) *</label>
              <input type="text" id="pTitleBn" required placeholder="যেমন: রেইনগার্ড প্রো ছাতা" />
            </div>
            <div>
              <label>Name (English) *</label>
              <input type="text" id="pTitleEn" required placeholder="e.g. RainGuard Pro Umbrella" />
            </div>
            <div>
              <label>ক্যাটাগরি</label>
              <select id="pCat">
                <option value="folding">ফোল্ডিং ছাতা (Folding)</option>
                <option value="golf">বড় গল্ফ ছাতা (Golf)</option>
                <option value="kids">কিডস ছাতা (Kids)</option>
              </select>
            </div>
            <div>
              <label>মূল্য (৳) *</label>
              <input type="number" id="pPrice" min="1" required placeholder="750" />
            </div>
            <div>
              <label>পুরনো মূল্য (৳)</label>
              <input type="number" id="pOldPrice" min="1" placeholder="950" />
            </div>
            <div>
              <label>রঙসমূহ (কমা দিয়ে)</label>
              <input type="text" id="pColors" value="Navy Blue, Black, Red" />
            </div>
            <div class="full">
              <label>ছবির URL (কমা দিয়ে একাধিক ছবি)</label>
              <input type="text" id="pImages" value="https://images.unsplash.com/photo-1519692933481-e162a57d6721?auto=format&fit=crop&w=900&q=80" />
            </div>
            <div class="full">
              <button type="submit" class="btn btn-warm" style="width:100%; justify-content:center;">প্রোডাক্ট সংরক্ষণ করুন</button>
            </div>
          </form>
        </div>

        <div class="card">
          <h2 style="font-size: 1.12rem; margin-bottom: 14px;">কাস্টমার অর্ডারসমূহ (<span id="orderTotalCount">0</span>)</h2>
          <div id="ordersList"></div>
        </div>
      </div>

      <div class="card">
        <h2 style="font-size: 1.12rem; margin-bottom: 14px;">বর্তমান প্রোডাক্ট তালিকা (<span id="prodTotalCount">0</span>)</h2>
        <div id="productsList"></div>
      </div>
    </div>
  </div>

  <script>
    const KEYS = {
      PRODUCTS: "umbrellanest_products_v1",
      ORDERS: "umbrellanest_orders_v1",
      AUTH: "umbrellanest_admin_auth_v1"
    };

    const ADMIN_PIN = "1234";

    function setUnlocked(unlocked) {
      sessionStorage.setItem(KEYS.AUTH, unlocked ? "1" : "0");
      document.getElementById("pinGateCard").style.display = unlocked ? "none" : "block";
      document.getElementById("adminWorkspace").style.display = unlocked ? "block" : "none";
      if (unlocked) renderAll();
    }

    document.getElementById("pinForm").addEventListener("submit", e => {
      e.preventDefault();
      const val = document.getElementById("pinInput").value.trim();
      if (val === ADMIN_PIN) {
        document.getElementById("pinErr").textContent = "";
        setUnlocked(true);
      } else {
        document.getElementById("pinErr").textContent = "ভুল পিন! (ডিফল্ট পিন: 1234)";
      }
    });

    document.getElementById("lockBtn").addEventListener("click", () => setUnlocked(false));

    function getProducts() {
      return JSON.parse(localStorage.getItem(KEYS.PRODUCTS) || "[]");
    }

    function saveProducts(list) {
      localStorage.setItem(KEYS.PRODUCTS, JSON.stringify(list));
      renderProducts();
    }

    function getOrders() {
      return JSON.parse(localStorage.getItem(KEYS.ORDERS) || "[]");
    }

    function saveOrders(list) {
      localStorage.setItem(KEYS.ORDERS, JSON.stringify(list));
      renderOrders();
    }

    document.getElementById("addProductForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const cat = document.getElementById("pCat").value;
      const catMap = {
        folding: ["ফোল্ডিং ছাতা", "Folding Umbrella"],
        golf: ["বড় গল্ফ ছাতা", "Large Golf Umbrella"],
        kids: ["কিডস ছাতা", "Kids Umbrella"]
      };
      const colorsRaw = document.getElementById("pColors").value.split(",").map(s => s.trim()).filter(Boolean);
      const imgsRaw = document.getElementById("pImages").value.split(",").map(s => s.trim()).filter(Boolean);
      const price = Number(document.getElementById("pPrice").value);
      const oldPrice = Number(document.getElementById("pOldPrice").value) || Math.round(price * 1.25);

      const newItem = {
        id: "un-" + Date.now(),
        category: cat,
        catBn: catMap[cat][0],
        catEn: catMap[cat][1],
        titleBn: document.getElementById("pTitleBn").value.trim(),
        titleEn: document.getElementById("pTitleEn").value.trim(),
        price,
        oldPrice,
        colors: (colorsRaw.length ? colorsRaw : ["Navy Blue"]).map(c => ({ nameBn: c, nameEn: c, hex: "#0f3d5e" })),
        sizes: ["21 Inch (Standard)"],
        materialBn: "ওয়াটার-রিপেলেন্ট পঞ্জি ফ্যাব্রিক",
        materialEn: "Water-Repellent Pongee Fabric",
        descBn: "Umbrella Nest-এর নতুন মানসম্মত ছাতা।",
        descEn: "Quality all-weather umbrella from Umbrella Nest.",
        images: imgsRaw.length ? imgsRaw : ["https://images.unsplash.com/photo-1519692933481-e162a57d6721?auto=format&fit=crop&w=900&q=80"]
      };

      const list = getProducts();
      list.unshift(newItem);
      saveProducts(list);
      this.reset();
    });

    function deleteProduct(id) {
      const next = getProducts().filter(p => p.id !== id);
      saveProducts(next);
    }

    function updateOrderStatus(idx, status) {
      const orders = getOrders();
      if (!orders[idx]) return;
      orders[idx].status = status;
      saveOrders(orders);
    }

    function renderProducts() {
      const list = getProducts();
      document.getElementById("prodTotalCount").textContent = list.length;
      document.getElementById("productsList").innerHTML = list.map(p => `
        <div class="list-item">
          <div>
            <strong>${p.titleBn}</strong> (${p.titleEn})
            <div class="meta">দাম: ৳${p.price} • রঙ: ${(p.colors || []).length}টি</div>
          </div>
          <button type="button" class="btn btn-danger" onclick="deleteProduct('${p.id}')">মুছুন</button>
        </div>
      `).join("") || `<div class="meta">কোনো প্রোডাক্ট নেই।</div>`;
    }

    function renderOrders() {
      const orders = getOrders();
      document.getElementById("orderTotalCount").textContent = orders.length;
      document.getElementById("ordersList").innerHTML = orders.map((o, i) => `
        <div class="list-item">
          <div>
            <strong>#${o.orderId}</strong> — ${o.name}
            <div class="meta">ফোন ১: ${o.phone1} | ফোন ২: ${o.phone2} | ঠিকানা: ${o.address} (${o.district})</div>
            <div class="meta">দাম: ৳${o.productPrice} + ডেলিভারি: ৳${o.deliveryCost} = <strong>মোট: ৳${o.totalPrice}</strong></div>
          </div>
          <select onchange="updateOrderStatus(${i}, this.value)" style="width:auto;">
            <option value="Pending" ${o.status === "Pending" ? "selected" : ""}>Pending</option>
            <option value="Confirmed" ${o.status === "Confirmed" ? "selected" : ""}>Confirmed</option>
            <option value="Delivered" ${o.status === "Delivered" ? "selected" : ""}>Delivered</option>
            <option value="Cancelled" ${o.status === "Cancelled" ? "selected" : ""}>Cancelled</option>
          </select>
        </div>
      `).join("") || `<div class="meta">এখনো কোনো অর্ডার আসেনি।</div>`;
    }

    function renderAll() {
      renderProducts();
      renderOrders();
    }

    if (sessionStorage.getItem(KEYS.AUTH) === "1") {
      setUnlocked(true);
    }
  </script>
</body>
</html>
